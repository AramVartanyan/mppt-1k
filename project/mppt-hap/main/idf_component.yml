## IDF Component Manager Manifest File
dependencies:
  # NTC thermistor on the on-chip ADC (redundant TH2)
  espressif/ntc_driver: "^1.1.0"
  # HD44780 character LCD; used standalone with a project write callback
  # (PCF8574 over driver/i2c_master), no i2cdev / pcf8574 dependencies.
  esp-idf-lib/hd44780: "^1.3.0"
  # header-only delay/compat helpers required by hd44780 (no i2cdev/pcf8574)
  esp-idf-lib/esp_idf_lib_helpers: "^1.4.0"
  # mDNS is required by the HomeKit SDK (esp_hap_core) and shared by captive-wifi
  espressif/mdns: "^1.2"
  ## Required IDF version
  idf:
    version: ">=5.5"
